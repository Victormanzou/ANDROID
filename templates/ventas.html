{% extends 'base.html' %}

{% block content %}

<div class="row g-3">

    <!-- =========================
         POS
    ========================= -->
    <div class="col-12 col-lg-8">

        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body">

                <!-- HEADER -->
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">

                    <h4 class="fw-bold mb-0">
                        <i class="bi bi-cart4 text-primary"></i>
                        Punto de Venta
                    </h4>

                    <button class="btn btn-primary"
                            onclick="toggleEscaner()">
                        <i class="bi bi-camera"></i>
                        Escanear
                    </button>

                </div>

                <!-- CÁMARA -->
                <div id="contenedor-lector"
                     class="mb-3"
                     style="
                        display:none;
                        border:2px solid #0d6efd;
                        padding:10px;
                        border-radius:16px;
                     ">

                    <div id="reader"></div>

                    <button class="btn btn-danger w-100 mt-3"
                            onclick="toggleEscaner()">
                        Detener Cámara
                    </button>

                </div>

                <!-- INPUT -->
                <input type="text"
                       id="buscadorVentas"
                       class="form-control form-control-lg mb-3"
                       placeholder="Escanea o escribe código"
                       autocomplete="off"
                       inputmode="text">

                <!-- TABLA -->
                <div class="table-responsive">

                    <table class="table align-middle">

                        <thead>
                            <tr>
                                <th>Producto</th>
                                <th class="text-center">Cant</th>
                                <th>Precio</th>
                                <th>Subtotal</th>
                                <th></th>
                            </tr>
                        </thead>

                        <tbody id="listaVenta"></tbody>

                    </table>

                </div>

            </div>
        </div>

    </div>

    <!-- =========================
         PANEL DERECHO
    ========================= -->
    <div class="col-12 col-lg-4">

        <div class="card border-0 shadow-sm mb-3">

            <div class="card-body">

                <!-- TOTAL -->
                <div class="card bg-primary text-white text-center p-3 mb-3 border-0">

                    <h5>Total</h5>

                    <h1 id="totalPagar"
                        class="fw-bold">
                        $0.00
                    </h1>

                </div>

                <!-- PAGO -->
                <input type="number"
                       id="inputPago"
                       class="form-control form-control-lg mb-3"
                       placeholder="Pago cliente">

                <!-- BOTONES -->
                <div class="d-grid gap-2">

                    <button class="btn btn-success btn-lg"
                            onclick="finalizarVenta()">
                        COBRAR
                    </button>

                    <button class="btn btn-danger"
                            onclick="cancelarVenta()">
                        CANCELAR
                    </button>

                </div>

                <hr>

                <!-- ITEMS -->
                <div class="d-flex justify-content-between mb-3">

                    <span class="fw-semibold">
                        Artículos:
                    </span>

                    <span id="conteoArticulos">
                        0
                    </span>

                </div>

                <!-- CAMBIO -->
                <div class="alert alert-secondary text-center mb-0">

                    Cambio:

                    <h4 id="cambioEntregado"
                        class="fw-bold mb-0">
                        $0.00
                    </h4>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- =========================
     OVERLAY TICKET
========================= -->
<div id="overlayTicket"
     style="
        display:none;
        position:fixed;
        top:0;
        left:0;
        width:100%;
        height:100%;
        background:white;
        z-index:99999;
        padding:15px;
        overflow:auto;
     ">

    <div id="contenidoTicket"></div>

    <button class="btn btn-secondary w-100 mt-3"
            onclick="cerrarTicket()">
        ← Volver a ventas
    </button>

    <button class="btn btn-primary w-100 mt-2"
            onclick="imprimirTicket()">
        🖨️ Imprimir
    </button>

</div>

<!-- QR -->
<script src="https://unpkg.com/html5-qrcode"></script>

<script>

let carrito = [];
let scanner = null;
let bloqueado = false;

/* =========================
   CÁMARA
========================= */
function toggleEscaner() {

    const c = document.getElementById('contenedor-lector');

    if (c.style.display === 'none') {

        c.style.display = 'block';
        iniciarEscaner();

    } else {

        c.style.display = 'none';

        if (scanner) {
            scanner.clear().catch(()=>{});
            scanner = null;
        }
    }
}

function iniciarEscaner() {

    Html5Qrcode.getCameras().then(devices => {

        let cameraId = devices.find(d =>
            d.label.toLowerCase().includes("back") ||
            d.label.toLowerCase().includes("trasera")
        )?.id || devices[0].id;

        scanner = new Html5Qrcode("reader");

        scanner.start(
            cameraId,
            {
                fps: 10,
                qrbox: 220
            },
            (text) => {

                if (bloqueado) return;

                bloqueado = true;

                buscarYAgregar(text);

                vibrar();

                setTimeout(() => {
                    bloqueado = false;
                }, 800);
            }
        );

    }).catch(err => {
        console.log(err);
    });
}

/* =========================
   BUSCAR PRODUCTO
========================= */
function buscarYAgregar(codigo) {

    if (!codigo) return;

    fetch(`/buscar_producto/${codigo}`)

        .then(r => r.json())

        .then(data => {

            console.log(data);

            if (!data.success) {

                alert("Producto no encontrado");
                return;
            }

            let p = data.producto;

            agregar({
                codigo_barras: p.codigo_barras,
                nombre: p.nombre,
                precio: parseFloat(p.precio_venta)
            });

        })

        .catch(err => {
            console.log(err);
        });
}

/* =========================
   AGREGAR
========================= */
function agregar(p) {

    let ex = carrito.find(x =>
        x.codigo_barras === p.codigo_barras
    );

    if (ex) {

        ex.cantidad++;

    } else {

        carrito.push({
            codigo_barras: p.codigo_barras,
            nombre: p.nombre,
            precio: Number(p.precio),
            cantidad: 1
        });
    }

    render();
}

/* =========================
   RENDER
========================= */
function render() {

    let lista = document.getElementById('listaVenta');

    lista.innerHTML = '';

    let total = 0;
    let items = 0;

    carrito.forEach((p, i) => {

        let sub = p.precio * p.cantidad;

        total += sub;
        items += p.cantidad;

        lista.innerHTML += `
        <tr>

            <td class="fw-semibold">
                ${p.nombre}
            </td>

            <td class="text-center">

                <div class="d-flex justify-content-center align-items-center gap-2">

                    <button class="btn btn-sm btn-outline-danger"
                            onclick="menos(${i})">
                        -
                    </button>

                    <span>${p.cantidad}</span>

                    <button class="btn btn-sm btn-outline-primary"
                            onclick="mas(${i})">
                        +
                    </button>

                </div>

            </td>

            <td>
                $${p.precio.toFixed(2)}
            </td>

            <td class="fw-bold">
                $${sub.toFixed(2)}
            </td>

            <td>

                <button class="btn btn-sm btn-danger"
                        onclick="del(${i})">

                    <i class="bi bi-trash"></i>

                </button>

            </td>

        </tr>
        `;
    });

    document.getElementById('totalPagar').innerText =
        `$${total.toFixed(2)}`;

    document.getElementById('conteoArticulos').innerText =
        items;
}

/* =========================
   CANTIDADES
========================= */
function mas(i) {

    carrito[i].cantidad++;
    render();
}

function menos(i) {

    carrito[i].cantidad--;

    if (carrito[i].cantidad <= 0) {
        carrito.splice(i, 1);
    }

    render();
}

function del(i) {

    carrito.splice(i, 1);
    render();
}

/* =========================
   FINALIZAR
========================= */
function finalizarVenta() {

    if (carrito.length === 0) return;

    let pago = parseFloat(
        document.getElementById('inputPago').value
    );

    let total = carrito.reduce((a,b)=>
        a + b.precio*b.cantidad, 0
    );

    if (isNaN(pago) || pago < total) {

        alert("Pago insuficiente");
        return;
    }

    let ventaFinal =
        JSON.parse(JSON.stringify(carrito));

    fetch('/finalizar_venta', {

        method:'POST',

        headers:{
            'Content-Type':'application/json'
        },

        body: JSON.stringify({
            carrito
        })

    })

    .then(r => r.json())

    .then(data => {

        console.log(data);

        generarTicket(
            ventaFinal,
            pago,
            total
        );

        document.getElementById(
            'cambioEntregado'
        ).innerText =
            `$${(pago-total).toFixed(2)}`;

        carrito = [];

        render();

        document.getElementById(
            'inputPago'
        ).value = '';
    });
}

/* =========================
   TICKET
========================= */
function generarTicket(carrito, pago, total) {

    let fecha = new Date().toLocaleString();

    let items = '';

    carrito.forEach(p => {

        items += `
        <tr>

            <td>${p.nombre}</td>

            <td>${p.cantidad}</td>

            <td>$${p.precio.toFixed(2)}</td>

            <td>
                $${(p.precio * p.cantidad).toFixed(2)}
            </td>

        </tr>
        `;
    });

    document.getElementById(
        "contenidoTicket"
    ).innerHTML = `

        <div style="font-family:Arial;">

            <h2 style="text-align:center;">
                🧾 ABARROTES PRO
            </h2>

            <p>${fecha}</p>

            <table style="
                width:100%;
                border-collapse:collapse;
            ">

                <tr>
                    <th>Producto</th>
                    <th>Cant</th>
                    <th>P/U</th>
                    <th>Total</th>
                </tr>

                ${items}

            </table>

            <hr>

            <h3>
                TOTAL: $${total.toFixed(2)}
            </h3>

            <p>
                PAGO: $${pago.toFixed(2)}
            </p>

            <p>
                CAMBIO: $${(pago-total).toFixed(2)}
            </p>

            <br>

            <p style="text-align:center;">
                Gracias por su compra
            </p>

        </div>
    `;

    document.getElementById(
        "overlayTicket"
    ).style.display = "block";
}

/* =========================
   CERRAR
========================= */
function cerrarTicket() {

    document.getElementById(
        "overlayTicket"
    ).style.display = "none";
}

/* =========================
   IMPRIMIR
========================= */
function imprimirTicket() {

    let contenido =
        document.getElementById(
            "contenidoTicket"
        ).innerHTML;

    let w = window.open(
        '',
        '',
        'width=300,height=600'
    );

    w.document.write(contenido);
    w.document.close();
    w.print();
}

/* =========================
   CANCELAR
========================= */
window.cancelarVenta = function () {

    carrito = [];

    render();

    document.getElementById(
        'inputPago'
    ).value = '';

    document.getElementById(
        'buscadorVentas'
    ).value = '';

    document.getElementById(
        'cambioEntregado'
    ).innerText = "$0.00";

    if (scanner) {

        try {
            scanner.clear();
        } catch(e){}

        scanner = null;
    }

    document.getElementById(
        'contenedor-lector'
    ).style.display = 'none';
};

/* =========================
   ENTER FIX
========================= */
document.addEventListener('DOMContentLoaded', () => {

    const input =
        document.getElementById(
            'buscadorVentas'
        );

    input.focus();

    input.addEventListener('keydown', (e) => {

        if (e.key === 'Enter') {

            e.preventDefault();

            let codigo =
                input.value.trim();

            if (!codigo) return;

            buscarYAgregar(codigo);

            input.value = '';
        }
    });
});

/* =========================
   VIBRACIÓN
========================= */
function vibrar(){

    if (navigator.vibrate) {
        navigator.vibrate(80);
    }
}

</script>

{% endblock %}
