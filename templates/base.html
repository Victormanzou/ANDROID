<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <!-- RESPONSIVE -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#6366f1">

    <title>Abarrotes Pro</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">

    <style>

        body{
            overflow-x:hidden;
        }

        /* =========================
           NAVBAR
        ========================= */
        .navbar{
            margin:10px;
            border-radius:20px;
        }

        /* =========================
           MOBILE HEADER
        ========================= */
        .mobile-header{
            display:none;
        }

        /* =========================
           BOTTOM NAV
        ========================= */
        .bottom-nav{
            display:none;
        }

        /* =========================
           MOBILE
        ========================= */
        @media (max-width: 768px){

            /* ocultar navbar desktop */
            .navbar{
                display:none;
            }

            /* mostrar header */
            .mobile-header{
                display:flex;
                justify-content:space-between;
                align-items:center;

                position:sticky;
                top:0;
                z-index:1000;

                padding:14px 18px;

                background:linear-gradient(135deg,#6366f1,#8b5cf6);

                color:white;

                box-shadow:0 4px 20px rgba(0,0,0,.15);
            }

            .mobile-header .brand{
                font-weight:700;
                font-size:1rem;
            }

            /* contenido */
            main{
                padding-bottom:90px !important;
            }

            /* bottom nav */
            .bottom-nav{
                display:flex;

                position:fixed;
                bottom:0;
                left:0;
                right:0;

                height:72px;

                background:white;

                border-top:1px solid rgba(0,0,0,.08);

                z-index:2000;
            }

            .bottom-nav a{
                flex:1;

                display:flex;
                flex-direction:column;
                align-items:center;
                justify-content:center;

                text-decoration:none;
                color:#64748b;

                font-size:.72rem;
                font-weight:600;

                transition:.2s;
            }

            .bottom-nav a.active{
                color:#6366f1;
            }

            .bottom-nav svg{
                width:22px;
                height:22px;
                margin-bottom:4px;
            }

            /* tarjetas */
            .card{
                border-radius:22px !important;
            }

            /* tablas */
            .table-responsive{
                font-size:.85rem;
            }

            /* textos */
            h1,h2,h3{
                font-size:1.3rem !important;
            }

        }

    </style>
</head>

<body>

    <!-- =========================================
         NAVBAR DESKTOP
    ========================================== -->
    <nav class="navbar navbar-expand-lg navbar-dark">

        <div class="container-fluid px-3">

            <!-- LOGO -->
            <a class="navbar-brand fw-bold"
                href="{{ url_for('index') }}">

                <i class="bi bi-shop me-2"></i>
                Abarrotes Pro

            </a>

            <!-- HAMBURGER -->
            <button class="navbar-toggler border-0"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMain">

                <span class="navbar-toggler-icon"></span>

            </button>

            <!-- LINKS -->
            <div class="collapse navbar-collapse"
                id="navbarMain">

                <ul class="navbar-nav me-auto gap-2">

                    <li class="nav-item">
                        <a class="nav-link"
                            href="{{ url_for('index') }}">
                            Dashboard
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                            href="{{ url_for('ventas') }}">
                            Ventas
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                            href="{{ url_for('inventario') }}">
                            Inventario
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                            href="{{ url_for('compras') }}">
                            Compras
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                            href="{{ url_for('finanzas') }}">
                            Finanzas
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- =========================================
         MOBILE HEADER
    ========================================== -->
    <div class="mobile-header">

        <div class="brand">
            <i class="bi bi-shop me-2"></i>
            Abarrotes Pro
        </div>

        <div>
            <i class="bi bi-bell-fill fs-5"></i>
        </div>

    </div>

    <!-- =========================================
         MAIN CONTENT
    ========================================== -->
    <main class="container-fluid py-3">

        {% block content %}
        {% endblock %}

    </main>

    <!-- =========================================
         MOBILE BOTTOM NAV
    ========================================== -->
    <nav class="bottom-nav">

        <a href="{{ url_for('index') }}"
            class="{{ 'active' if request.endpoint == 'index' else '' }}">

            <i class="bi bi-speedometer2"></i>
            Inicio

        </a>

        <a href="{{ url_for('ventas') }}"
            class="{{ 'active' if request.endpoint == 'ventas' else '' }}">

            <i class="bi bi-bag-check"></i>
            Ventas

        </a>

        <a href="{{ url_for('inventario') }}"
            class="{{ 'active' if request.endpoint == 'inventario' else '' }}">

            <i class="bi bi-box-seam"></i>
            Stock

        </a>

        <a href="{{ url_for('compras') }}"
            class="{{ 'active' if request.endpoint == 'compras' else '' }}">

            <i class="bi bi-truck"></i>
            Compras

        </a>

        <a href="{{ url_for('finanzas') }}"
            class="{{ 'active' if request.endpoint == 'finanzas' else '' }}">

            <i class="bi bi-graph-up"></i>
            Finanzas

        </a>

    </nav>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- ACTIVE LINK -->
    <script>

        const currentPath = window.location.pathname;

        document.querySelectorAll('.navbar .nav-link').forEach(link => {

            if(link.getAttribute('href') === currentPath){

                link.classList.add('active');

                link.style.background = 'rgba(255,255,255,0.15)';
                link.style.borderRadius = '12px';

            }

        });

    </script>

    {% block scripts %}
    {% endblock %}

</body>
</html>
