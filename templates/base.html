<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <!-- RESPONSIVE -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#6366f1">

    <title>Abarrotes Pro</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">

    <style>

        *{
            box-sizing:border-box;
        }

        body{
            overflow-x:hidden;
            background:#f8fafc;
        }

        /* =========================
           NAVBAR GENERAL
        ========================= */
        .navbar{
            margin:12px;
            border-radius:22px;
            background:linear-gradient(135deg,#6366f1,#8b5cf6);
            box-shadow:0 8px 30px rgba(99,102,241,.25);
            padding:12px 16px;
        }

        .navbar-brand{
            font-size:1.1rem;
            font-weight:700;
        }

        .navbar .nav-link{
            color:white !important;
            padding:10px 14px;
            border-radius:14px;
            transition:.2s;
            font-weight:600;
        }

        .navbar .nav-link:hover{
            background:rgba(255,255,255,.15);
        }

        .navbar .nav-link.active{
            background:rgba(255,255,255,.18);
        }

        /* =========================
           MOBILE TOP NAV
        ========================= */
        .mobile-top-nav{
            display:none;
        }

        /* =========================
           MAIN
        ========================= */
        main{
            padding:10px;
        }

        /* =========================
           MOBILE
        ========================= */
        @media (max-width:768px){

            /* ocultar navbar desktop */
            .navbar{
                display:none;
            }

            /* TOP NAV MÓVIL */
            .mobile-top-nav{

                display:flex;
                align-items:center;
                justify-content:space-between;

                position:sticky;
                top:0;
                z-index:3000;

                padding:14px 16px;

                background:linear-gradient(135deg,#6366f1,#8b5cf6);

                box-shadow:0 4px 20px rgba(0,0,0,.15);
            }

            .mobile-brand{
                color:white;
                font-weight:700;
                font-size:1rem;
                display:flex;
                align-items:center;
                gap:8px;
            }

            /* BOTONES ARRIBA */
            .mobile-menu{

                display:flex;
                gap:8px;

                overflow-x:auto;
                padding:12px;

                background:white;

                position:sticky;
                top:64px;
                z-index:2500;

                border-bottom:1px solid rgba(0,0,0,.06);

                scrollbar-width:none;
            }

            .mobile-menu::-webkit-scrollbar{
                display:none;
            }

            .mobile-menu a{

                flex-shrink:0;

                text-decoration:none;
                color:#475569;

                background:#f1f5f9;

                padding:10px 14px;

                border-radius:14px;

                font-size:.85rem;
                font-weight:700;

                transition:.2s;
            }

            .mobile-menu a.active{

                background:#6366f1;
                color:white;

                box-shadow:0 4px 14px rgba(99,102,241,.25);
            }

            /* tarjetas */
            .card{
                border-radius:22px !important;
            }

            /* textos */
            h1,h2,h3{
                font-size:1.2rem !important;
            }

            /* tablas */
            .table-responsive{
                font-size:.85rem;
            }

            main{
                padding:12px;
            }

        }

    </style>
</head>

<body>

    <!-- =========================================
         NAVBAR DESKTOP
    ========================================== -->
    <nav class="navbar navbar-expand-lg navbar-dark">

        <div class="container-fluid px-2">

            <!-- LOGO -->
            <a class="navbar-brand"
                href="{{ url_for('index') }}">

                <i class="bi bi-shop me-2"></i>
                Abarrotes Pro

            </a>

            <!-- HAMBURGER -->
            <button class="navbar-toggler border-0"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMain">

                <span class="navbar-toggler-icon"></span>

            </button>

            <!-- LINKS -->
            <div class="collapse navbar-collapse"
                id="navbarMain">

                <ul class="navbar-nav me-auto gap-2">

                    <li class="nav-item">
                        <a class="nav-link {{ 'active' if request.endpoint == 'index' else '' }}"
                            href="{{ url_for('index') }}">
                            <i class="bi bi-speedometer2 me-1"></i>
                            Dashboard
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link {{ 'active' if request.endpoint == 'ventas' else '' }}"
                            href="{{ url_for('ventas') }}">
                            <i class="bi bi-bag-check me-1"></i>
                            Ventas
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link {{ 'active' if request.endpoint == 'inventario' else '' }}"
                            href="{{ url_for('inventario') }}">
                            <i class="bi bi-box-seam me-1"></i>
                            Inventario
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link {{ 'active' if request.endpoint == 'compras' else '' }}"
                            href="{{ url_for('compras') }}">
                            <i class="bi bi-truck me-1"></i>
                            Compras
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link {{ 'active' if request.endpoint == 'finanzas' else '' }}"
                            href="{{ url_for('finanzas') }}">
                            <i class="bi bi-graph-up me-1"></i>
                            Finanzas
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- =========================================
         MOBILE HEADER
    ========================================== -->
    <div class="mobile-top-nav">

        <div class="mobile-brand">
            <i class="bi bi-shop"></i>
            Abarrotes Pro
        </div>

        <!-- CAMPANA -->
        <div class="dropdown">

            <button class="btn text-white border-0 p-0"
                data-bs-toggle="dropdown">

                <i class="bi bi-bell-fill fs-5"></i>

            </button>

            <ul class="dropdown-menu dropdown-menu-end shadow border-0 rounded-4 p-2">

                <li>
                    <h6 class="dropdown-header">
                        Notificaciones
                    </h6>
                </li>

                <li>
                    <a class="dropdown-item rounded-3"
                        href="{{ url_for('inventario') }}">

                        Stock bajo detectado

                    </a>
                </li>

                <li>
                    <a class="dropdown-item rounded-3"
                        href="{{ url_for('ventas') }}">

                        Nuevas ventas hoy

                    </a>
                </li>

            </ul>

        </div>

    </div>

    <!-- =========================================
         MOBILE MENU ARRIBA
    ========================================== -->
    <div class="mobile-menu">

        <a href="{{ url_for('index') }}"
            class="{{ 'active' if request.endpoint == 'index' else '' }}">

            <i class="bi bi-speedometer2 me-1"></i>
            Inicio

        </a>

        <a href="{{ url_for('ventas') }}"
            class="{{ 'active' if request.endpoint == 'ventas' else '' }}">

            <i class="bi bi-bag-check me-1"></i>
            Ventas

        </a>

        <a href="{{ url_for('inventario') }}"
            class="{{ 'active' if request.endpoint == 'inventario' else '' }}">

            <i class="bi bi-box-seam me-1"></i>
            Stock

        </a>

        <a href="{{ url_for('compras') }}"
            class="{{ 'active' if request.endpoint == 'compras' else '' }}">

            <i class="bi bi-truck me-1"></i>
            Compras

        </a>

        <a href="{{ url_for('finanzas') }}"
            class="{{ 'active' if request.endpoint == 'finanzas' else '' }}">

            <i class="bi bi-graph-up me-1"></i>
            Finanzas

        </a>

    </div>

    <!-- =========================================
         MAIN CONTENT
    ========================================== -->
    <main class="container-fluid">

        {% block content %}
        {% endblock %}

    </main>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    {% block scripts %}
    {% endblock %}

</body>
</html>
