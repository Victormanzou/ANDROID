<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <!-- RESPONSIVE REAL -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#6366f1">

    <title>Abarrotes Pro</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">

    <style>

        body{
            overflow-x:hidden;
            background:#f8fafc;
        }

        /* =========================================
           TOPBAR
        ========================================== */

        .topbar{

            position:sticky;
            top:0;
            z-index:2000;

            margin:10px;

            border-radius:20px;

            background:linear-gradient(135deg,#6366f1,#8b5cf6);

            box-shadow:0 8px 30px rgba(0,0,0,.12);

            padding:12px 18px;
        }

        .topbar-container{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:20px;
        }

        /* =========================================
           BRAND
        ========================================== */

        .brand{
            color:white;
            text-decoration:none;
            font-weight:700;
            font-size:1rem;

            display:flex;
            align-items:center;
        }

        /* =========================================
           MENU
        ========================================== */

        .top-menu{
            display:flex;
            align-items:center;
            gap:10px;
            flex:1;
            justify-content:center;
        }

        .top-menu a{

            color:white;
            text-decoration:none;

            padding:10px 14px;

            border-radius:12px;

            font-size:.9rem;
            font-weight:600;

            transition:.2s;
        }

        .top-menu a:hover{
            background:rgba(255,255,255,.15);
        }

        .top-menu a.active{
            background:rgba(255,255,255,.2);
        }

        /* =========================================
           RIGHT AREA
        ========================================== */

        .right-area{
            display:flex;
            align-items:center;
            gap:12px;
        }

        .notification-btn{

            width:42px;
            height:42px;

            border-radius:14px;

            background:rgba(255,255,255,.18);

            display:flex;
            align-items:center;
            justify-content:center;

            color:white;

            position:relative;

            text-decoration:none;
        }

        .notification-dot{

            position:absolute;

            top:8px;
            right:8px;

            width:8px;
            height:8px;

            border-radius:50%;

            background:#ff4757;
        }

        /* =========================================
           MAIN
        ========================================== */

        main{
            padding:20px;
        }

        /* =========================================
           MOBILE
        ========================================== */

        @media(max-width:768px){

            .topbar{
                padding:10px 12px;
            }

            .topbar-container{
                flex-direction:column;
                align-items:stretch;
                gap:10px;
            }

            .brand-area{
                display:flex;
                align-items:center;
                justify-content:space-between;
            }

            .brand{
                font-size:.95rem;
            }

            /* MENÚ MOBILE */

            .top-menu{

                display:flex;

                flex-wrap:nowrap;

                overflow-x:auto;

                overflow-y:hidden;

                gap:8px;

                justify-content:flex-start;

                padding-bottom:4px;

                scrollbar-width:none;

                -webkit-overflow-scrolling:touch;
            }

            .top-menu::-webkit-scrollbar{
                display:none;
            }

            .top-menu a{

                flex:0 0 auto;

                white-space:nowrap;

                font-size:.72rem;

                padding:7px 10px;

                border-radius:10px;
            }

            .top-menu a i{
                margin-right:4px !important;
            }

            /* CONTENIDO */

            main{
                padding:12px !important;
            }

            /* CARDS */

            .card{
                border-radius:18px !important;
            }

            /* TITULOS */

            h1,h2,h3{
                font-size:1.1rem !important;
            }

            /* TABLAS */

            .table-responsive{
                font-size:.82rem;
            }

        }

    </style>

</head>

<body>

    <!-- =========================================
         TOPBAR
    ========================================== -->

    <div class="topbar">

        <div class="topbar-container">

            <!-- MOBILE HEADER -->
            <div class="brand-area">

                <!-- LOGO -->
                <a href="{{ url_for('index') }}" class="brand">

                    <i class="bi bi-shop me-2"></i>
                    Abarrotes Pro

                </a>

                <!-- CAMPANA -->
                <div class="right-area">

                    <a href="{{ url_for('inventario') }}"
                       class="notification-btn">

                        <i class="bi bi-bell-fill"></i>

                        <span class="notification-dot"></span>

                    </a>

                </div>

            </div>

            <!-- MENU -->
            <nav class="top-menu">

                <a href="{{ url_for('index') }}"
                   class="{{ 'active' if request.endpoint == 'index' else '' }}">

                    <i class="bi bi-speedometer2 me-1"></i>
                    Dashboard

                </a>

                <a href="{{ url_for('ventas') }}"
                   class="{{ 'active' if request.endpoint == 'ventas' else '' }}">

                    <i class="bi bi-bag-check me-1"></i>
                    Ventas

                </a>

                <a href="{{ url_for('inventario') }}"
                   class="{{ 'active' if request.endpoint == 'inventario' else '' }}">

                    <i class="bi bi-box-seam me-1"></i>
                    Inventario

                </a>

                <a href="{{ url_for('compras') }}"
                   class="{{ 'active' if request.endpoint == 'compras' else '' }}">

                    <i class="bi bi-truck me-1"></i>
                    Compras

                </a>

                <a href="{{ url_for('finanzas') }}"
                   class="{{ 'active' if request.endpoint == 'finanzas' else '' }}">

                    <i class="bi bi-graph-up me-1"></i>
                    Finanzas

                </a>

            </nav>

        </div>

    </div>

    <!-- =========================================
         MAIN CONTENT
    ========================================== -->

    <main class="container-fluid">

        {% block content %}
        {% endblock %}

    </main>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
