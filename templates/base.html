<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#6366f1">

    <title>Abarrotes Pro</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">

    <style>

        body{
            overflow-x:hidden;
            background:#f8fafc;
        }

        /* =========================
           NAVBAR GLOBAL
        ========================= */

        .topbar{
            position:sticky;
            top:0;
            z-index:3000;

            background:linear-gradient(135deg,#6366f1,#8b5cf6);

            padding:12px 16px;

            box-shadow:0 4px 20px rgba(0,0,0,.12);
        }

        .topbar-container{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:10px;
        }

        /* logo */
        .brand{
            color:white;
            font-weight:700;
            font-size:1rem;
            text-decoration:none;
            white-space:nowrap;
        }

        /* menu central */
        .top-menu{
            display:flex;
            align-items:center;
            justify-content:center;
            gap:8px;

            flex-wrap:wrap;
        }

        .top-menu a{
            text-decoration:none;
            color:rgba(255,255,255,.9);

            padding:8px 12px;

            border-radius:12px;

            font-size:.88rem;
            font-weight:600;

            transition:.2s;
        }

        .top-menu a:hover{
            background:rgba(255,255,255,.15);
            color:white;
        }

        .top-menu a.active{
            background:white;
            color:#6366f1;
        }

        /* campana */
        .bell-btn{
            color:white;
            font-size:1.2rem;
            position:relative;
            text-decoration:none;
        }

        .badge-pulse{
            position:absolute;
            top:0;
            right:-2px;

            width:8px;
            height:8px;

            background:#ff4757;
            border-radius:50%;
        }

        /* contenido */
        main{
            padding:18px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media(max-width:768px){

            .topbar-container{
                flex-direction:column;
                align-items:stretch;
            }

            .brand-area{
                display:flex;
                align-items:center;
                justify-content:space-between;
            }

            .top-menu{
                overflow-x:auto;
                flex-wrap:nowrap;

                padding-bottom:4px;
            }

            .top-menu::-webkit-scrollbar{
                display:none;
            }

            .top-menu a{
                white-space:nowrap;
                font-size:.78rem;
                padding:7px 10px;
            }

            h1,h2,h3{
                font-size:1.25rem !important;
            }

            .card{
                border-radius:20px !important;
            }

            .table-responsive{
                font-size:.85rem;
            }

        }

    </style>

</head>

<body>

    <!-- ======================================
         TOPBAR
    ======================================= -->

    <div class="topbar">

        <div class="topbar-container">

            <!-- FILA SUPERIOR -->
            <div class="brand-area">

                <a href="{{ url_for('index') }}"
                   class="brand">

                    <i class="bi bi-shop me-1"></i>
                    Abarrotes Pro

                </a>

                <!-- CAMPANA -->
                <a href="{{ url_for('inventario') }}"
                   class="bell-btn">

                    <i class="bi bi-bell-fill"></i>

                    <span class="badge-pulse"></span>

                </a>

            </div>

            <!-- MENU -->
            <div class="top-menu">

                <a href="{{ url_for('index') }}"
                   class="{{ 'active' if request.endpoint == 'index' else '' }}">

                    <i class="bi bi-speedometer2 me-1"></i>
                    Dashboard

                </a>

                <a href="{{ url_for('ventas') }}"
                   class="{{ 'active' if request.endpoint == 'ventas' else '' }}">

                    <i class="bi bi-bag-check me-1"></i>
                    Ventas

                </a>

                <a href="{{ url_for('inventario') }}"
                   class="{{ 'active' if request.endpoint == 'inventario' else '' }}">

                    <i class="bi bi-box-seam me-1"></i>
                    Inventario

                </a>

                <a href="{{ url_for('compras') }}"
                   class="{{ 'active' if request.endpoint == 'compras' else '' }}">

                    <i class="bi bi-truck me-1"></i>
                    Compras

                </a>

                <a href="{{ url_for('finanzas') }}"
                   class="{{ 'active' if request.endpoint == 'finanzas' else '' }}">

                    <i class="bi bi-graph-up me-1"></i>
                    Finanzas

                </a>

            </div>

        </div>

    </div>

    <!-- ======================================
         CONTENIDO
    ======================================= -->

    <main class="container-fluid">

        {% block content %}
        {% endblock %}

    </main>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    {% block scripts %}
    {% endblock %}

</body>

</html>
